openapi: 3.0.3
info:
  title: Mini-CricHeroes API
  version: 1.0.0
  description: REST API for managing cricket matches, innings, players, teams, scoring
    and results.
paths:
  /auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /auth/register/:
    post:
      operationId: auth_register
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          description: User registered successfully.
        '400':
          description: Registration validation error.
  /auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /matches/:
    get:
      operationId: matches_list
      tags:
      - matches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Match'
          description: ''
    post:
      operationId: matches_create
      tags:
      - matches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Match'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Match'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Match'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
          description: ''
        '400':
          description: Validation error.
  /matches/{match_id}/:
    get:
      operationId: matches_retrieve
      parameters:
      - in: path
        name: match_id
        schema:
          type: string
        required: true
      tags:
      - matches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
          description: ''
        '404':
          description: Match not found.
    put:
      operationId: matches_update
      parameters:
      - in: path
        name: match_id
        schema:
          type: string
        required: true
      tags:
      - matches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Match'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Match'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Match'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
          description: ''
        '400':
          description: Validation error.
        '404':
          description: Match not found.
    delete:
      operationId: matches_delete
      parameters:
      - in: path
        name: match_id
        schema:
          type: string
        required: true
      tags:
      - matches
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Match deleted successfully.
        '404':
          description: Match not found.
  /matches/{match_id}/complete/:
    post:
      operationId: matches_complete
      parameters:
      - in: path
        name: match_id
        schema:
          type: string
        required: true
      tags:
      - matches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
          description: ''
        '400':
          description: Match cannot be completed.
        '404':
          description: Match not found.
  /matches/{match_id}/innings/:
    post:
      operationId: matches_innings_create
      parameters:
      - in: path
        name: match_id
        schema:
          type: string
        required: true
      tags:
      - matches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InningsCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InningsCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InningsCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Innings'
          description: ''
        '400':
          description: Invalid innings request.
        '404':
          description: Match not found.
  /matches/{match_id}/innings/{innings_number}/balls/:
    post:
      operationId: innings_record_ball
      parameters:
      - in: path
        name: innings_number
        schema:
          type: integer
        required: true
      - in: path
        name: match_id
        schema:
          type: string
        required: true
      tags:
      - matches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BallRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BallRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BallRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ball'
          description: ''
        '400':
          description: Invalid ball data.
        '404':
          description: Match or innings not found.
  /matches/{match_id}/innings/{innings_number}/bowler/:
    post:
      operationId: innings_set_bowler
      parameters:
      - in: path
        name: innings_number
        schema:
          type: integer
        required: true
      - in: path
        name: match_id
        schema:
          type: string
        required: true
      tags:
      - matches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BowlerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BowlerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BowlerRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Innings'
          description: ''
        '400':
          description: Invalid bowler.
        '404':
          description: Match or innings not found.
  /matches/{match_id}/innings/{innings_number}/opening-batsmen/:
    post:
      operationId: innings_opening_batsmen
      parameters:
      - in: path
        name: innings_number
        schema:
          type: integer
        required: true
      - in: path
        name: match_id
        schema:
          type: string
        required: true
      tags:
      - matches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningBatsmenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OpeningBatsmenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpeningBatsmenRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Innings'
          description: ''
        '400':
          description: Invalid opening batsmen.
        '404':
          description: Match or innings not found.
  /matches/{match_id}/innings/{innings_number}/replace-batsman/:
    post:
      operationId: innings_replace_batsman
      parameters:
      - in: path
        name: innings_number
        schema:
          type: integer
        required: true
      - in: path
        name: match_id
        schema:
          type: string
        required: true
      tags:
      - matches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceBatsmanRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReplaceBatsmanRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReplaceBatsmanRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Innings'
          description: ''
        '400':
          description: Invalid replacement batsman.
        '404':
          description: Match or innings not found.
  /matches/{match_id}/innings/{innings_number}/wicket/:
    post:
      operationId: innings_record_wicket
      parameters:
      - in: path
        name: innings_number
        schema:
          type: integer
        required: true
      - in: path
        name: match_id
        schema:
          type: string
        required: true
      tags:
      - matches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WicketRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WicketRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WicketRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ball'
          description: ''
        '400':
          description: Invalid wicket data.
        '404':
          description: Match or innings not found.
  /matches/{match_id}/result/:
    post:
      operationId: matches_result
      parameters:
      - in: path
        name: match_id
        schema:
          type: string
        required: true
      tags:
      - matches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
          description: ''
        '400':
          description: Unable to calculate match result.
        '404':
          description: Match not found.
  /matches/{match_id}/scorecard/:
    get:
      operationId: matches_scorecard
      parameters:
      - in: path
        name: match_id
        schema:
          type: string
        required: true
      tags:
      - matches
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scorecard'
          description: ''
        '404':
          description: Match not found.
  /matches/{match_id}/start/:
    post:
      operationId: matches_start
      parameters:
      - in: path
        name: match_id
        schema:
          type: string
        required: true
      tags:
      - matches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
          description: ''
        '400':
          description: Match cannot be started.
        '404':
          description: Match not found.
  /matches/{match_id}/toss/:
    post:
      operationId: matches_toss
      parameters:
      - in: path
        name: match_id
        schema:
          type: string
        required: true
      tags:
      - matches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TossRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TossRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TossRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
          description: ''
        '400':
          description: Invalid toss request.
        '404':
          description: Match not found.
  /matches/{match_id}/toss/decision/:
    post:
      operationId: matches_toss_decision
      parameters:
      - in: path
        name: match_id
        schema:
          type: string
        required: true
      tags:
      - matches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TossDecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TossDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TossDecisionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
          description: ''
        '400':
          description: Invalid toss decision.
        '404':
          description: Match not found.
  /players/:
    get:
      operationId: players_list
      tags:
      - players
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Player'
          description: ''
    post:
      operationId: players_create
      tags:
      - players
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Player'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Player'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Player'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
          description: ''
        '400':
          description: Validation error.
  /players/{player_id}/:
    get:
      operationId: players_retrieve
      parameters:
      - in: path
        name: player_id
        schema:
          type: string
        required: true
      tags:
      - players
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
          description: ''
        '404':
          description: Player not found.
    put:
      operationId: players_update
      parameters:
      - in: path
        name: player_id
        schema:
          type: string
        required: true
      tags:
      - players
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Player'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Player'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Player'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
          description: ''
        '400':
          description: Validation error.
        '404':
          description: Player not found.
    delete:
      operationId: players_delete
      parameters:
      - in: path
        name: player_id
        schema:
          type: string
        required: true
      tags:
      - players
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Player deleted successfully.
        '404':
          description: Player not found.
  /teams/:
    get:
      operationId: teams_list
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
          description: ''
    post:
      operationId: teams_create
      tags:
      - teams
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Team'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Team'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Team'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
        '400':
          description: Validation error.
  /teams/{team_id}/:
    get:
      operationId: teams_retrieve
      parameters:
      - in: path
        name: team_id
        schema:
          type: string
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
        '404':
          description: Team not found.
    put:
      operationId: teams_update
      parameters:
      - in: path
        name: team_id
        schema:
          type: string
        required: true
      tags:
      - teams
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Team'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Team'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Team'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
        '400':
          description: Validation error.
        '404':
          description: Team not found.
    delete:
      operationId: teams_delete
      parameters:
      - in: path
        name: team_id
        schema:
          type: string
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Team deleted successfully.
        '404':
          description: Team not found.
components:
  schemas:
    Ball:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        over:
          type: integer
          readOnly: true
        ball_number:
          type: integer
          readOnly: true
        striker:
          type: string
          readOnly: true
        non_striker:
          type: string
          readOnly: true
        bowler:
          type: string
          readOnly: true
        runs:
          type: integer
          readOnly: true
        extras:
          type: integer
          readOnly: true
        extra_type:
          type: string
          readOnly: true
          nullable: true
        is_legal:
          type: boolean
          readOnly: true
        wicket:
          type: boolean
          readOnly: true
        wicket_type:
          type: string
          readOnly: true
          nullable: true
        player_out:
          type: string
          readOnly: true
          nullable: true
      required:
      - ball_number
      - bowler
      - extra_type
      - extras
      - id
      - is_legal
      - non_striker
      - over
      - player_out
      - runs
      - striker
      - wicket
      - wicket_type
    BallRequest:
      type: object
      properties:
        runs:
          type: integer
          minimum: 0
          default: 0
        extra_type:
          type: string
          nullable: true
        extra_runs:
          type: integer
          minimum: 0
          default: 0
    BatsmanScorecard:
      type: object
      properties:
        player:
          type: string
        runs:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        balls_faced:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        fours:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        sixes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        strike_rate:
          type: number
          format: double
          readOnly: true
        is_out:
          type: boolean
        dismissal_type:
          type: string
          nullable: true
          maxLength: 20
      required:
      - player
      - strike_rate
    BowlerRequest:
      type: object
      properties:
        bowler_id:
          type: string
      required:
      - bowler_id
    BowlerScorecard:
      type: object
      properties:
        player:
          type: string
        overs:
          type: string
          readOnly: true
        balls_bowled:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        runs_conceded:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        wickets:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        wides:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        no_balls:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        economy:
          type: number
          format: double
          readOnly: true
      required:
      - economy
      - overs
      - player
    CallEnum:
      enum:
      - heads
      - tails
      type: string
      description: |-
        * `heads` - heads
        * `tails` - tails
    DecisionEnum:
      enum:
      - bat
      - bowl
      type: string
      description: |-
        * `bat` - bat
        * `bowl` - bowl
    Innings:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        innings_number:
          type: integer
          readOnly: true
        match:
          type: string
          readOnly: true
        batting_team:
          type: string
          readOnly: true
        bowling_team:
          type: string
          readOnly: true
        overs:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        current_over:
          type: integer
          readOnly: true
        balls_bowled:
          type: integer
          readOnly: true
        total_runs:
          type: integer
          readOnly: true
        wickets_fallen:
          type: integer
          readOnly: true
        striker:
          type: string
          readOnly: true
          nullable: true
        non_striker:
          type: string
          readOnly: true
          nullable: true
        current_bowler:
          type: string
          readOnly: true
          nullable: true
      required:
      - balls_bowled
      - batting_team
      - bowling_team
      - current_bowler
      - current_over
      - id
      - innings_number
      - match
      - non_striker
      - overs
      - striker
      - total_runs
      - wickets_fallen
    InningsCreateRequest:
      type: object
      properties:
        overs:
          type: integer
          minimum: 1
      required:
      - overs
    Match:
      type: object
      properties:
        match_id:
          type: string
          maxLength: 20
        team1:
          type: string
        team2:
          type: string
        ground:
          type: string
          maxLength: 200
        ball_type:
          type: string
          maxLength: 20
        overs:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        status:
          type: string
          readOnly: true
        toss_call:
          type: string
